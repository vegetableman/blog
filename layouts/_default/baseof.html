<!DOCTYPE html>
<html lang="en">
{{- partial "head.html" . -}}
<body>
  <div class="site-shell {{ if .IsHome }}is-home{{ else }}is-interior{{ end }}">
    {{- partial "profile.html" . -}}
    <main class="site-main" id="main-content">
      {{ if not .IsHome }}<a class="back-link" href="/">← Writing</a>{{ end }}
      {{- block "main" . }}{{- end }}
      {{- partial "footer.html" . -}}
    </main>
  </div>
</body>
</html>
